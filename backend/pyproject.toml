[project]
name = "policypilot-backend"
version = "0.1.0"
description = "PolicyPilot backend: ingestion, retrieval, tools, agent and API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pgvector>=0.3.6,<1",
  "redis>=5.2,<6",
  "pymupdf>=1.25,<2",
  "fastembed>=0.4.2,<1",
  "openai>=1.57,<2",
  "python-multipart>=0.0.19",
  "sse-starlette>=2.1,<3",
  "tiktoken>=0.8,<1",
  "authlib>=1.3,<2",
  "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.28",
  "ruff>=0.8.4",
  "mypy>=1.13",
  "types-redis",
  "moto[server]>=5,<6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.mypy.overrides]]
# PyMuPDF ships partial type information; treat its objects as Any in the parser.
module = ["app.ingest.parse"]
disallow_untyped_calls = false
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pymupdf.*", "pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["authlib.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
