# Sign-in with a real identity provider (Keycloak) on top of docker-compose.yml:
#   set -a && . ./.env.auth-demo && set +a
#   docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d
# The two demo users (alice, bob) get the generated passwords; nothing is committed. Dev mode only.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-${KC_ALICE_PASSWORD:?set KC_ALICE_PASSWORD}}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_ALICE_PASSWORD: ${KC_ALICE_PASSWORD:?set KC_ALICE_PASSWORD}
      KC_BOB_PASSWORD: ${KC_BOB_PASSWORD:?set KC_BOB_PASSWORD}
    volumes:
      - ./deploy/keycloak/realm-policypilot.json:/opt/keycloak/data/import/realm-policypilot.json:ro
      - ./deploy/keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "127.0.0.1:8180:8080"
    restart: unless-stopped

  # Registration is intentionally enabled only in the local Compose demonstration. The committed realm
  # remains safe for the kind overlay and production-like deployments.
  keycloak-init:
    image: quay.io/keycloak/keycloak:26.0
    depends_on:
      keycloak:
        condition: service_started
    environment:
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-${KC_ALICE_PASSWORD:?set KC_ALICE_PASSWORD}}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until /opt/keycloak/bin/kcadm.sh config credentials --server http://keycloak:8080 --realm master --user admin --password "$$KC_ADMIN_PASSWORD"; do sleep 2; done
        /opt/keycloak/bin/kcadm.sh update realms/policypilot -s registrationAllowed=true -s resetPasswordAllowed=false

  backend:
    environment:
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8180/realms/policypilot
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/policypilot
      OIDC_CLIENT_ID: policypilot
      PUBLIC_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY}
    depends_on:
      keycloak:
        condition: service_started
