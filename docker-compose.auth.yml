# Sign-in with a real identity provider (Keycloak) on top of docker-compose.yml:
#   export KC_ALICE_PASSWORD=$(openssl rand -hex 12) KC_BOB_PASSWORD=$(openssl rand -hex 12) \
#          AUTH_SECRET_KEY=$(openssl rand -hex 32)
#   docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d
# The two demo users (alice, bob) get the generated passwords; nothing is committed. Dev mode only.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-${KC_ALICE_PASSWORD:?set KC_ALICE_PASSWORD}}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_ALICE_PASSWORD: ${KC_ALICE_PASSWORD:?set KC_ALICE_PASSWORD}
      KC_BOB_PASSWORD: ${KC_BOB_PASSWORD:?set KC_BOB_PASSWORD}
    volumes:
      - ./deploy/keycloak/realm-policypilot.json:/opt/keycloak/data/import/realm-policypilot.json:ro
    ports:
      - "127.0.0.1:8180:8080"
    restart: unless-stopped

  backend:
    environment:
      AUTH_MODE: oidc
      OIDC_ISSUER: http://localhost:8180/realms/policypilot
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/policypilot
      OIDC_CLIENT_ID: policypilot
      PUBLIC_ORIGIN: http://localhost:${FRONTEND_PORT:-8080}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY}
    depends_on:
      keycloak:
        condition: service_started
