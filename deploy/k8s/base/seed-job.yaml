# Loads the bundled policy documents (shipped as the versioned image policypilot-corpus). Idempotent: documents
# already stored (matched by SHA-256) are skipped, and a PostgreSQL advisory lock keeps two seeders apart.
apiVersion: batch/v1
kind: Job
metadata:
  name: policypilot-seed
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: seed}
    spec:
      serviceAccountName: policypilot
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: corpus
          image: policypilot-corpus
          command: ["sh", "-c", "cp -r /corpus/. /data/corpus/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: corpus, mountPath: /data/corpus}
        - name: wait-schema
          image: policypilot-backend
          command: ["python", "-m", "app.cli", "wait-schema"]
          envFrom:
            - configMapRef: {name: policypilot-config}
            - secretRef: {name: policypilot-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: seed
          image: policypilot-backend
          command: ["python", "-m", "app.cli", "seed"]
          envFrom:
            - configMapRef: {name: policypilot-config}
            - secretRef: {name: policypilot-secrets}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: corpus, mountPath: /data/corpus}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: corpus, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
