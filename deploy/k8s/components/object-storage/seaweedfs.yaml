apiVersion: v1
kind: Service
metadata:
  name: objects
  labels: {app.kubernetes.io/name: objects}
spec:
  selector: {app.kubernetes.io/name: objects}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: objects
spec:
  serviceName: objects
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: objects}
  template:
    metadata:
      labels: {app.kubernetes.io/name: objects}
    spec:
      serviceAccountName: policypilot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
          args: ["server", "-s3", "-s3.config=/etc/s3/s3.json", "-dir=/data", "-volume.max=20", "-ip.bind=0.0.0.0"]
          ports: [{containerPort: 8333, name: s3}]
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/s3, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: s3-config
          secret: {secretName: s3-secrets, items: [{key: s3.json, path: s3.json}]}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
