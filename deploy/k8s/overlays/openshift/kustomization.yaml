# OpenShift overlay. STATUS: rendered and reviewed only; it has NOT been deployed to an OpenShift cluster.
# What it changes: pods drop their fixed user IDs so the restricted-v2 SCC can assign an arbitrary UID (the
# backend image keeps /data and /models group-0 writable for exactly this), and a Route replaces the Ingress.
# What it does not do: provide PostgreSQL/Redis that run under an arbitrary UID (use a managed service or an
# operator), nor an identity provider (set OIDC_* in the ConfigMap to the university provider).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: policypilot
resources:
  - ../../base
  - route.yaml
components:
  - ../../components/network-policies
patches:
  - target: {kind: Deployment}
    patch: |-
      - {op: remove, path: /spec/template/spec/securityContext/runAsUser}
      - {op: remove, path: /spec/template/spec/securityContext/runAsGroup}
  - target: {kind: StatefulSet}
    patch: |-
      - {op: remove, path: /spec/template/spec/securityContext/runAsUser}
      - {op: remove, path: /spec/template/spec/securityContext/runAsGroup}
      - {op: remove, path: /spec/template/spec/securityContext/fsGroup}
  - target: {kind: Job}
    patch: |-
      - {op: remove, path: /spec/template/spec/securityContext/runAsUser}
      - {op: remove, path: /spec/template/spec/securityContext/runAsGroup}
  - target: {kind: Deployment, name: "api|worker"}
    patch: |-
      - {op: remove, path: /spec/template/spec/securityContext/fsGroup}
