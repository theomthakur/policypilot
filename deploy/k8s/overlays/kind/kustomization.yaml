apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: policypilot
resources:
  - ../../base
  - keycloak.yaml
  - ingress.yaml
patches:
  - path: config-patch.yaml
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-policypilot.json
  - name: keycloak-theme
    files:
      - theme.properties=theme-assets/theme.properties
      - login.ftl=theme-assets/login.ftl
      - login-password.ftl=theme-assets/login-password.ftl
      - messages_en.properties=theme-assets/messages/messages_en.properties
      - policypilot.css=theme-assets/css/policypilot.css
      - policy-pilot-mark.png=theme-assets/img/policy-pilot-mark.png
      - manrope-latin-400-normal.woff2=theme-assets/fonts/manrope-latin-400-normal.woff2
      - manrope-latin-500-normal.woff2=theme-assets/fonts/manrope-latin-500-normal.woff2
      - manrope-latin-600-normal.woff2=theme-assets/fonts/manrope-latin-600-normal.woff2
      - dm-mono-latin-400-normal.woff2=theme-assets/fonts/dm-mono-latin-400-normal.woff2
      - dm-mono-latin-500-normal.woff2=theme-assets/fonts/dm-mono-latin-500-normal.woff2
generatorOptions:
  disableNameSuffixHash: true
