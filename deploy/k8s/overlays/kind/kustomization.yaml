apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: policypilot
resources:
  - ../../base
  - keycloak.yaml
  - ingress.yaml
patches:
  - path: config-patch.yaml
configMapGenerator:
  - name: keycloak-realm
    files:
      - realm-policypilot.json
generatorOptions:
  disableNameSuffixHash: true
