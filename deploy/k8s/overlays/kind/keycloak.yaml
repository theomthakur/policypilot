# A development identity provider so the cluster demo has real sign-in. Dev mode keeps its data in the pod:
# it is for demonstration only. A real deployment points OIDC_ISSUER at the university provider instead.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: {app.kubernetes.io/name: keycloak}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30180}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak}
    spec:
      serviceAccountName: policypilot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: KC_HOSTNAME, value: "http://localhost:8180"}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
          envFrom:
            - secretRef: {name: keycloak-secrets}
          startupProbe:
            httpGet: {path: /realms/policypilot/.well-known/openid-configuration, port: http}
            periodSeconds: 5
            failureThreshold: 80
          readinessProbe:
            httpGet: {path: /realms/policypilot/.well-known/openid-configuration, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1280Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /opt/keycloak/data}
            - {name: realm, mountPath: /opt/keycloak/data/import}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: realm
          configMap: {name: keycloak-realm}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: keycloak}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}
  policyTypes: [Ingress]
  ingress:
    - ports: [{protocol: TCP, port: 8080}]   # the API (token exchange) and the browser (through the node port)
