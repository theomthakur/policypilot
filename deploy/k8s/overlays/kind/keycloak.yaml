# A development identity provider so the cluster demo has real sign-in. Dev mode keeps its data in the pod:
# it is for demonstration only. A real deployment points OIDC_ISSUER at the university provider instead.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels: {app.kubernetes.io/name: keycloak}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: keycloak}
  ports:
    - {name: http, port: 8080, targetPort: 8080, nodePort: 30180}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: keycloak}
  template:
    metadata:
      labels: {app.kubernetes.io/name: keycloak}
    spec:
      serviceAccountName: policypilot
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: KC_HOSTNAME, value: "http://localhost:8180"}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
          envFrom:
            - secretRef: {name: keycloak-secrets}
          startupProbe:
            httpGet: {path: /realms/policypilot/.well-known/openid-configuration, port: http}
            periodSeconds: 5
            failureThreshold: 80
          readinessProbe:
            httpGet: {path: /realms/policypilot/.well-known/openid-configuration, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1280Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /opt/keycloak/data}
            - {name: realm, mountPath: /opt/keycloak/data/import}
            - {name: theme, mountPath: /opt/keycloak/themes/policypilot}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
        - name: realm
          configMap: {name: keycloak-realm}
        - name: theme
          configMap:
            name: keycloak-theme
            items:
              - {key: theme.properties, path: login/theme.properties}
              - {key: login.ftl, path: login/login.ftl}
              - {key: login-password.ftl, path: login/login-password.ftl}
              - {key: messages_en.properties, path: login/messages/messages_en.properties}
              - {key: policypilot.css, path: login/resources/css/policypilot.css}
              - {key: policy-pilot-mark.png, path: login/resources/img/policy-pilot-mark.png}
              - {key: favicon.ico, path: login/resources/img/favicon.ico}
              - {key: manrope-latin-400-normal.woff2, path: login/resources/fonts/manrope-latin-400-normal.woff2}
              - {key: manrope-latin-500-normal.woff2, path: login/resources/fonts/manrope-latin-500-normal.woff2}
              - {key: manrope-latin-600-normal.woff2, path: login/resources/fonts/manrope-latin-600-normal.woff2}
              - {key: dm-mono-latin-400-normal.woff2, path: login/resources/fonts/dm-mono-latin-400-normal.woff2}
              - {key: dm-mono-latin-500-normal.woff2, path: login/resources/fonts/dm-mono-latin-500-normal.woff2}
