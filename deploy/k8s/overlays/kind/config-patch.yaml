apiVersion: v1
kind: ConfigMap
metadata:
  name: policypilot-config
data:
  PUBLIC_ORIGIN: http://localhost:8088
  OIDC_ISSUER: http://localhost:8180/realms/policypilot
  OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/policypilot
  OIDC_CLIENT_ID: policypilot
  # The demo is served over plain http on localhost; a real deployment sets both to true behind TLS.
  AUTH_COOKIE_SECURE: "false"
  SESSION_COOKIE_SECURE: "false"
