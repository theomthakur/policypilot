kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 8088, listenAddress: "127.0.0.1", protocol: TCP}
      - {containerPort: 30180, hostPort: 8180, listenAddress: "127.0.0.1", protocol: TCP}
