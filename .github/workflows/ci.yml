name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  corpus-and-eval-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            corpus/requirements.txt
            eval/requirements.txt
      - run: pip install -r corpus/requirements.txt -r eval/requirements.txt ruff==0.14.3
      - run: ruff check corpus eval
      - run: python corpus/generate.py
      - run: git diff --exit-code -- corpus
      - run: python eval/run.py --validate-only

  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: policypilot
          POSTGRES_USER: policypilot
          POSTGRES_PASSWORD: policypilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U policypilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.11"
          enable-cache: true
      - run: uv sync --frozen --dev
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run mypy app
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
        env:
          APP_ENV: test
          LLM_PROVIDER: fake
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: policypilot
          REDIS_URL: redis://localhost:6379/0

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  image-builds:
    runs-on: ubuntu-24.04
    needs: [backend, frontend, corpus-and-eval-contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: policypilot-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: policypilot-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  compose-smoke:
    runs-on: ubuntu-24.04
    needs: [image-builds]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: |
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=fake/' .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=policypilot/' .env
      - run: docker compose up --build -d --wait
      - run: ./scripts/smoke_test.sh
      - if: always()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose.log
      - if: always()
        run: docker compose down -v

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
