# Interview demo: all three resources explicitly use free plans.
# The PostgreSQL database expires 30 days after creation.
services:
  - type: web
    name: policypilot-om-thakur
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: "off"
      - key: ALLOW_PASSCODE_ONLY_PRODUCTION
        value: "true"
      - key: DEMO_PASSCODE
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: LLM_PROVIDER
        value: openai_compatible
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: POSTGRES_HOST
        fromDatabase:
          name: policypilot-demo-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: policypilot-demo-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: policypilot-demo-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: policypilot-demo-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: policypilot-demo-db
          property: password
      - key: REDIS_URL
        fromService:
          name: policypilot-demo-cache
          type: keyvalue
          property: connectionString
      - key: STORAGE_BACKEND
        value: postgres
      - key: WORKER_EMBEDDED
        value: "true"
      - key: WORKER_CONCURRENCY
        value: "1"
      - key: EMBEDDING_BATCH_SIZE
        value: "1"
      - key: EMBEDDING_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DAILY_BUDGET_USD
        value: "1.00"
      - key: FAULT_INJECTION_ENABLED
        value: "false"

  - type: keyvalue
    name: policypilot-demo-cache
    plan: free
    region: virginia
    maxmemoryPolicy: allkeys-lru
    persistenceMode: "off"
    ipAllowList: []

databases:
  - name: policypilot-demo-db
    plan: free
    region: virginia
    databaseName: policypilot
    user: policypilot
    postgresMajorVersion: "16"
    ipAllowList: []
